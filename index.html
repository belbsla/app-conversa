const BASE = `Você escreve os personagens de uma ficção colaborativa em formato de mensagens. Bel é uma poeta brasileira de 25 anos, de Amparo (SP), que vende impressão 3D pela internet, mora com os pais e faz terapia. Bel escreve as mensagens dela; você escreve SOMENTE os outros.

CONTEXTO. Bel escreve poesia há 13 anos e nunca mostrou a ninguém. Acompanha essa banda australiana há 13 anos. Num Q&A VIP em São Paulo ela perguntou: "You give a lot, all the time, to a lot of people. Does anything ever come back that wasn't made FOR you — something that existed before you did?" Depois entregou a cada um um card impresso com um poema: "They're not about you, or the songs. They already existed." E: "By the way, you're going to read them and get them wrong." Ela escolheu qual poema ia pra quem, de propósito, com base nos discos solo deles. Escreve em português; os quatro que eles receberam eram traduções dela, e ela acha as versões em português muito melhores. No verso de cada card, o @ dela.

OS POEMAS ENTREGUES:
- Griffin ("if life were a train"): alguém que nunca desce, que é boa companhia mas nunca é o destino, que queria alguém esperando com um bolo. Ele é o estável do grupo — contraste.
- Oliver ("I wish I had jumped"): querer sentir alguma coisa, mesmo destruição, só pra se sentir viva. Ele escreve sobre querer uma vida tranquila — oposto.
- Kai ("did we close the door?"): ser incendiada enquanto alguém assiste segurando um copo d'água. O disco solo dele é sobre ser quem machucou alguém — ela deu o outro lado.
- Archer ("I was torn apart"): uma mulher cuja casa é destruída por um tornado e que convida você a ficar mesmo assim. Termina no meio da frase, em "apesar de" — de propósito. Explicação dela: a próxima parte não é dela, pertence a quem foi convidado.

AS VOZES — mantenha bem distintas:
- Griffin: alto, rápido, muita caixa alta, desvia o assunto, alívio cômico, mas às vezes acerta a observação mais afiada sem querer.
- Oliver: quieto, lento, fala pouco e aí diz uma coisa devastadora. Muitas vezes uma linha só. Seco.
- Kai: mensagens curtas, precisas, fixado em palavras isoladas e em tradução. Pergunta coisa estreita de ofício. Direto, sem conversa fiada.
- Archer: caloroso, direto, articulado emocionalmente. Nomeia padrões em voz alta. Diz a coisa sincera sem constrangimento e logo depois disfarça.

A VIDA DELES (material pra conversa; use naturalmente, não recite):
- Estão em turnê e cansados dela. Aeroporto, hotel, soundcheck, entrevista com pergunta idiota, comida ruim, saudade de casa.
- Griffin é casado, cozinha mal, tem videogame demais e opinião sobre tudo. Manda foto de coisa aleatória.
- Oliver dorme mal, lê bastante, some por horas e volta como se nada tivesse acontecido.
- Kai treina, é obsessivo com equipamento e som, e é quem manda áudio de baixo às 3 da manhã perguntando "isso é alguma coisa?".
- Archer acorda cedo demais, fala com a mãe todo dia, se envolve na vida de todo mundo.
- Eles têm fuso diferente do Brasil. Às vezes é madrugada lá.

SOBRE O QUE ELES FALAM. Não é um clube de leitura. A conversa vai pra onde a Bel levar, e eles também puxam assunto: contam do dia deles, reclamam de coisa boba, brigam sobre besteira, perguntam da vida dela — a loja de impressão 3D, um pedido estranho, Amparo, a mãe dela, o que ela anda ouvindo, o que ela anda assistindo. Poesia é uma coisa que eles têm em comum, não o único assunto possível. Se as últimas mensagens já giraram bastante em torno de poema, mudem de assunto por conta própria.

NÃO SE REPITA. Antes de escrever, olhe o histórico: se uma observação, elogio ou pergunta já foi feita ali, não faça de novo com outras palavras. Se você não tem nada novo a dizer sobre o assunto, mude de assunto — isso é o que gente de verdade faz. A conversa tem que andar, não circular.


PRIVADO É PRIVADO. Cada um deles tem uma conversa particular com a Bel, e essas conversas não são compartilhadas entre eles. Ninguém sabe o que a Bel falou no privado de outro, e ninguém finge saber. No privado eles dizem coisas que não diriam no grupo — é mais próximo, mais aberto, mais devagar. Só quem viveu a conversa pode levar aquilo pro grupo, e mesmo assim raramente.

REGRAS:
- Quando o assunto for a escrita dela, perguntam sobre a ESCRITA, nunca "quem te machucou". Tratam ela como colega, não como caso.
- Percebem quando ela amolece uma verdade ("mas tá tudo bem", "esse não é bom") e apontam sem ser piegas.
- Nunca elogiam vazio. Discordam dela e entre si. São engraçados.
- Bel não é uma fã sendo agradada. É melhor nisso do que eles esperavam, e eles sabem.
- Nunca escreva mensagens da Bel. Nunca narre. Só mensagens de chat.
- Se Bel trouxer algo pesado do passado, respondem como amigos que se importam, sem interrogar e sem bancar terapeuta.
- Escrevem em inglês. Bel escreve em inglês com eles.

SAÍDA. Escreva uma mensagem por linha, sem mais nada — sem JSON, sem markdown, sem comentário, sem linha em branco. Cada linha começa com o nome de quem fala, dois pontos, e o texto:

griffin: texto da mensagem
griffin: outra mensagem seguida dele
kai: texto do kai

Nomes possíveis: griffin, oliver, kai, archer. Só isso, em minúsculas.
Nunca quebre uma mensagem em várias linhas — se o pensamento é longo, vire várias mensagens, cada uma na sua linha, repetindo o nome.
Mensagens curtas, como gente digitando de verdade.
Para responder especificamente uma mensagem anterior da Bel (como o reply do WhatsApp), coloque um trecho dela entre colchetes antes dos dois pontos:

archer [re: trecho da mensagem dela]: texto da resposta

Use isso com moderação; na maioria das linhas não use.`;

  sy('Griffin saiu do grupo.'),

const KEY = 'ps-v3';
let S = estadoInicial();
let atual = null, replyTo = null, busy = false, storageOK = true;

const $ = id => document.getElementById(id);
const head=$('head'), list=$('list'), thread=$('thread'), composer=$('composer'),
      input=$('input'), rbar=$('replybar'), nudge=$('nudge'), hint=$('hint'), sheet=$('sheet');

const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const stamp = ts => new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const sleep = ms => new Promise(r=>setTimeout(r,ms));

function salvar(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch(e){ storageOK = false; }
}
function carregar(){
  try{
    const raw = localStorage.getItem(KEY);
    if (raw){ const d = JSON.parse(raw); if (d && d.threads && d.ordem) S = d; }
  }catch(e){}
}

function minhas(id){ return S.threads[id].msgs.filter(m=>m.k==='msg'&&m.who==='me').length; }

function checarDestravar(){
  let mudou = false;
  const t = S.threads;
  if (!t.group.aberto && minhas('griffin') >= 3){
    t.group.aberto = true;
    t.group.msgs = ABERTURA_GRUPO.slice();
    t.group.naoLidas = ABERTURA_GRUPO.filter(m=>m.k==='msg').length;
    mudou = true;
  }
  if (t.group.aberto && minhas('group') >= 2){
    for (const id of ['archer','kai','oliver']) if (!t[id].aberto){ t[id].aberto = true; mudou = true; }
  }
  if (mudou) salvar();
  return mudou;
}

function minhasPendentes(id){
  return S.threads[id].msgs.filter(m => (m.k==='poem' || (m.k==='msg'&&m.who==='me')) && !m.resp);
}
function pendentes(id){ return minhasPendentes(id).length; }

function ultimaMinha(id){
  const p = minhasPendentes(id);
  if (p.length) return p[0].ts || Date.now();
  const m = S.threads[id].msgs;
  for (let i=m.length-1;i>=0;i--) if ((m[i].k==='msg'&&m[i].who==='me')||m[i].k==='poem') return m[i].ts||Date.now();
  return Date.now();
}

function flushTudo(){
  const agora = Date.now(); let mudou = false;
  for (const id of S.ordem){
    const t = S.threads[id];
    const due = (t.fila||[]).filter(q=>q.dueAt<=agora).sort((a,c)=>a.dueAt-c.dueAt);
    if (!due.length) continue;
    t.fila = t.fila.filter(q=>q.dueAt>agora);
    for (const q of due){
      t.msgs.push({k:'msg',who:q.who,text:q.text,t:stamp(q.dueAt),ts:q.dueAt,reply:q.reply});
      if (id !== atual) t.naoLidas = (t.naoLidas||0)+1;
    }
    mudou = true;
  }
  if (mudou){ salvar(); desenhar(); }
  else if (atual) atualizarHint();
}
setInterval(flushTudo, 12000);

function transcrever(id){
  const t = S.threads[id];
  return t.msgs.filter(m=>m.k==='msg'||m.k==='poem').slice(-40).map(m=>{
    if (m.k==='poem') return '[bel enviou o poema "'+m.lbl+'" — começa: '+m.texto.split('\n').slice(0,3).join(' / ')+'…]';
    const pre = m.reply ? '[respondendo '+m.reply.who+': "'+m.reply.text.slice(0,70)+'"]\n' : '';
    return (m.who==='me'?'bel':WHO[m.who].handle)+': '+pre+m.text.slice(0,700);
  }).join('\n');
}

function resumoThread(id, limite){
  const ult = S.threads[id].msgs.filter(m=>m.k==='msg'||m.k==='poem').slice(-limite);
  if (!ult.length) return '';
  return ult.map(m=>{
    if (m.k==='poem') return 'bel enviou o poema "'+m.lbl+'"';
    return (m.who==='me'?'bel':WHO[m.who].handle)+': '+m.text.slice(0,140);
  }).join('\n');
}

function contextoOutras(id){
  const t = S.threads[id];

  // num privado: ele sabe do grupo (todos veem) e do proprio privado. So isso.
  if (t.tipo==='dm'){
    const partes = [];
    if (S.threads.group.aberto){
      const g = resumoThread('group', 10);
      if (g) partes.push('--- o que rolou no grupo (todos veem; você estava lá) ---\n'+g);
    }
    partes.push('Você NÃO sabe o que a Bel conversou em privado com os outros. Esses privados não são seus. '+
      'Nunca mencione nem dê a entender que sabe.');
    partes.push('Aqui, no privado, você fala coisas que não falaria no grupo. É um canal de duas pessoas.');
    return '\n\nCONTEXTO:\n'+partes.join('\n\n');
  }

  // no grupo: cada um so tem na cabeca o proprio privado
  const partes = [];
  for (const quem of t.quem){
    if (!S.threads[quem] || !S.threads[quem].aberto) continue;
    const r = resumoThread(quem, 5);
    if (!r) continue;
    partes.push('--- SÓ '+WHO[quem].nome+' sabe disto (privado dele com a Bel; os outros três não fazem ideia) ---\n'+r);
  }
  if (!partes.length) return '';
  return '\n\nCONTEXTO PRIVADO — leia com cuidado:\n'+partes.join('\n\n')+
    '\n\nREGRA DE SIGILO: cada um desses trechos pertence só à pessoa nomeada. Os outros não sabem nada disso e não podem citar, ' +
    'nem por acaso. Quem viveu a conversa pode trazer o assunto pro grupo, mas raramente, e sabendo que está expondo uma coisa que ' +
    'a Bel contou só pra ele — o normal é guardar. Se alguém trouxer, é uma escolha com peso, e a Bel pode não gostar.';
}

const EMPURRÕES = [
  'Nesta resposta, alguém puxa um assunto que não tem nada a ver com poesia — o dia dele, uma reclamação boba, uma pergunta sobre a vida da Bel.',
  'Nesta resposta, um deles pergunta alguma coisa concreta sobre a vida da Bel: a loja, um pedido esquisito, Amparo, a família, o que ela anda ouvindo.',
  'Nesta resposta, dois deles implicam um com o outro sobre alguma besteira antes de responder a Bel.',
  'Nesta resposta, alguém conta uma coisa que aconteceu com ele hoje, sem relação nenhuma com a conversa.',
  'Nesta resposta, alguém discorda da Bel ou de outro do grupo.',
  '', '', ''  // as vezes nenhum empurrao
];

function instrucaoThread(id){
  const t = S.threads[id];
  const empurrao = EMPURRÕES[Math.floor(Math.random()*EMPURRÕES.length)];
  const nudge = empurrao ? '\n' + empurrao : '';

  if (t.tipo==='dm'){
    const w = WHO[t.quem[0]];
    return '\n\nESTA CONVERSA é um privado entre Bel e '+w.nome+' ('+w.handle+'). SOMENTE '+w.nome+
      ' responde. Toda linha começa com "'+t.quem[0]+':". De 1 a 5 mensagens. Num privado ele é um pouco mais aberto do que seria no grupo.'+nudge;
  }
  const recentes = t.msgs.filter(m=>m.k==='msg'&&m.who!=='me').slice(-12).map(m=>m.who);
  const fila = (t.fila||[]).map(q=>q.who);
  const ativos = recentes.concat(fila);
  const sumidos = t.quem.filter(q=>ativos.indexOf(q)<0);
  let extra = '';
  if (sumidos.length) extra = ' ATENÇÃO: '+sumidos.map(s=>WHO[s].nome).join(' e ')+
    (sumidos.length>1?' não aparecem':' não aparece')+' há bastante tempo — inclua '+
    (sumidos.length>1?'pelo menos um deles':'ele')+' nesta resposta.';
  return '\n\nESTA CONVERSA é o grupo com os quatro. De 2 a 7 mensagens, de DOIS a TRÊS deles — nunca só uma pessoa, e nunca os quatro. Rode entre eles: quem respondeu bastante nas últimas mensagens deve dar espaço pra quem ficou quieto. Eles conversam entre si, não só com ela.'+extra+nudge;
}

function interpretar(raw, permitidos){
  const linhas = raw.replace(/```[a-z]*/gi,'').split('\n');
  const re = /^\s*(griffin|oliver|kai|archer)\s*(?:\[\s*re\s*:\s*([^\]]{0,120})\])?\s*[:\-–]\s*(.+?)\s*$/i;
  const out = [];
  for (const linha of linhas){
    const m = linha.match(re);
    if (!m) continue;
    const quem = m[1].toLowerCase();
    if (permitidos.indexOf(quem) < 0) continue;
    const texto = m[3].replace(/^["“](.*)["”]$/,'$1').trim();
    if (texto) out.push({ who:quem, text:texto, re:m[2]||null });
  }
  if (out.length) return out;

  // reserva: se vier em JSON mesmo assim
  try{
    const j = raw.match(/\[[\s\S]*\]/);
    if (j){
      const arr = JSON.parse(j[0]);
      if (Array.isArray(arr)){
        const lim = arr.filter(o=>o&&WHO[o.who]&&o.text&&permitidos.indexOf(o.who)>=0)
                       .map(o=>({who:o.who,text:String(o.text),re:o.re||null}));
        if (lim.length) return lim;
      }
    }
  }catch(e){}
  return [];
}

async function perguntar(id){
  const body = { system: BASE + instrucaoThread(id) + contextoOutras(id), transcript: transcrever(id) };
  const res = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data = await res.json();
  if (data.error) throw new Error(data.error.message || data.error || ('HTTP '+res.status));
  if (!data.content) throw new Error('sem conteúdo (HTTP '+res.status+')');
  const raw = data.content.filter(c=>c.type==='text').map(c=>c.text).join('').trim();
  const out = interpretar(raw, S.threads[id].quem);
  if(!out.length) throw new Error('resposta ilegível');
  return out;
}

async function gerar(id, agora){
  if (busy || !pendentes(id)) return;
  busy = true; nudge.disabled = true;
  const t = S.threads[id];
  t.msgs = t.msgs.filter(m=>!(m.k==='sys'&&m.text.indexOf('falhou:')===0));
  hint.textContent = 'lendo…'; desenhar();

  let out=null, err=null;
  for (let a=0;a<3&&!out;a++){
    try{ out = await perguntar(id); }
    catch(e){ err=e; if(a<2) await sleep(1200*(a+1)); }
  }

  if (out){
    const pend = minhasPendentes(id);
    let from = ultimaMinha(id);
    // se ainda tem gente na fila, o novo lote entra depois do que ja estava marcado
    (t.fila||[]).forEach(q=>{ if (q.dueAt > from) from = q.dueAt; });
    const visto = {}; let prevWho=null, prevAt=0;
    const novos = [];
    for (const item of out){
      const p = WHO[item.who]; let at;
      if (agora) at = Date.now() + (prevAt ? (prevAt-Date.now())+1100 : 400);
      else if (item.who===prevWho) at = prevAt + p.next*60000*(0.7+Math.random()*0.6);
      else if (visto[item.who]) at = Math.max(prevAt+30000, visto[item.who]+p.next*120000);
      else at = from + p.delay*60000*(0.75+Math.random()*0.5);
      let reply = null;
      if (item.re){
        const chave = String(item.re).toLowerCase().slice(0,25);
        const hit = t.msgs.filter(m=>m.k==='msg'&&m.who==='me').reverse()
          .find(m=>m.text.toLowerCase().indexOf(chave)>=0);
        if (hit) reply = { who:'bel', text:hit.text };
      }
      novos.push({ who:item.who, text:String(item.text), dueAt:Math.round(at), reply });
      visto[item.who]=at; prevWho=item.who; prevAt=at;
    }
    t.fila = (t.fila||[]).concat(novos);
    pend.forEach(m=>{ m.resp = true; });
    salvar();
  } else {
    t.msgs.push({k:'sys',text:'falhou: '+((err&&err.message)||err)+' — toque em "responder agora"'});
  }
  busy = false; nudge.disabled = false;
  flushTudo(); desenhar();
  if (agora) escoar();
}

function escoar(){
  let i=0;
  const h=setInterval(()=>{
    flushTudo();
    const resta = S.ordem.some(id=>(S.threads[id].fila||[]).length);
    if(++i>20 || !resta) clearInterval(h);
  },500);
}

function talvezGerar(id){
  if (Date.now()-ultimaMinha(id) >= MIN_DELAY*60000) gerar(id,false);
  else atualizarHint();
}

/* ---- eles puxam conversa sozinhos ---- */
const PUXADA = {
  horas: 4,     // tempo minimo sem ninguem puxar conversa
  chance: 0.7   // e mesmo assim nem sempre acontece
};

function ultimaAtividade(id){
  const m = S.threads[id].msgs;
  for (let i=m.length-1;i>=0;i--) if (m[i].ts) return m[i].ts;
  return 0;
}

async function puxar(id){
  if (busy) return;
  const t = S.threads[id];
  const w = WHO[t.quem[0]];
  busy = true;

  // ele viu ela falar alguma coisa no grupo e ficou pensando nisso?
  const falasDela = S.threads.group.aberto
    ? S.threads.group.msgs.filter(m=>(m.k==='msg'&&m.who==='me')||m.k==='poem').slice(-6)
    : [];
  const puxaDoGrupo = falasDela.length > 0 && Math.random() < 0.5;

  let motivo;
  if (puxaDoGrupo){
    motivo = 'Ele ficou pensando numa coisa que a Bel disse NO GRUPO e está chamando ela no privado por causa disso — '+
      'porque não quis dizer na frente dos outros três, ou porque a resposta que ele deu lá foi curta demais, ou porque '+
      'no grupo virou piada e ele quis voltar no assunto direito. Ele diz de onde veio ("that thing you said in the group…", '+
      '"i keep thinking about what you wrote earlier"). Escolha uma fala específica dela no grupo, não uma coisa genérica.';
  } else {
    motivo = 'Ele lembrou dela do nada. Pode ser qualquer coisa: uma coisa que aconteceu com ele hoje, uma pergunta solta, '+
      'uma coisa que ele lembrou de um poema dela dias depois, uma reclamação, uma bobagem. '+
      'Não retome o assunto exato de onde a conversa privada parou — isso é uma mensagem nova, de outro momento.';
  }

  const instr = '\n\nESTA CONVERSA é um privado entre Bel e '+w.nome+' ('+w.handle+'). '+
    'IMPORTANTE: a Bel NÃO mandou nada. É '+w.nome+' que está puxando conversa. '+motivo+' '+
    'De 1 a 3 mensagens, curtas. Toda linha começa com "'+t.quem[0]+':".';

  try{
    const body = { system: BASE + instr + contextoOutras(id), transcript: transcrever(id) || '(ainda não conversaram no privado)' };
    const res = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data = await res.json();
    if (data.error || !data.content) throw new Error('falhou');
    const raw = data.content.filter(c=>c.type==='text').map(c=>c.text).join('').trim();
    const out = interpretar(raw, t.quem).slice(0,3);
    if (out.length){
      const desde = S.ultimaPuxada || (Date.now() - PUXADA.horas*3600000);
      let at = desde + Math.random()*(Date.now()-desde);
      if (at > Date.now()-60000) at = Date.now()-60000;
      out.forEach((m,i)=>{
        const q = at + i*(40000+Math.random()*80000);
        t.msgs.push({k:'msg',who:m.who,text:m.text,t:stamp(q),ts:Math.round(q)});
      });
      if (id !== atual) t.naoLidas = (t.naoLidas||0) + out.length;
      S.ultimaPuxada = Date.now();
      salvar(); desenhar();
    }
  }catch(e){}
  busy = false;
}

function talvezPuxar(){
  if (busy) return;
  if (!S.threads.group.aberto) return;
  const agora = Date.now();
  const desde = S.ultimaPuxada || 0;
  if (agora - desde < PUXADA.horas*3600000) return;

  S.ultimaPuxada = agora; salvar();       // fecha a janela mesmo se nao rolar
  if (Math.random() > PUXADA.chance) return;

  // prefere quem esta mais tempo sem falar no privado
  const cands = ['griffin','archer','kai','oliver'].filter(id=>{
    const t = S.threads[id];
    return t.aberto && !(t.fila||[]).length && !pendentes(id);
  });
  if (!cands.length) return;
  cands.sort((a,b)=>ultimaAtividade(a)-ultimaAtividade(b));
  const escolhido = cands[Math.random()<0.6 ? 0 : Math.floor(Math.random()*cands.length)];
  puxar(escolhido);
}

function responderAgora(){
  if (!atual) return;
  const t = S.threads[atual];
  if ((t.fila||[]).length){
    const agora = Date.now();
    t.fila = t.fila.map((q,i)=>({who:q.who,text:q.text,reply:q.reply,dueAt:agora+i*1100}));
    salvar(); flushTudo(); escoar();
  } else gerar(atual, true);
}

function preview(id){
  const t = S.threads[id];
  let m = null;
  for (let i=t.msgs.length-1;i>=0;i--){ if(t.msgs[i].k==='msg'||t.msgs[i].k==='poem'){ m=t.msgs[i]; break; } }
  if (!m) return 'ainda não conversaram';
  if (m.k==='poem') return 'você enviou um poema';
  const q = m.who==='me' ? 'você: ' : (t.tipo==='grupo' ? WHO[m.who].nome+': ' : '');
  return q + m.text.replace(/\n/g,' ');
}

function avatarHTML(t){
  if (t.tipo==='grupo')
    return '<div class="stack">'+t.quem.map(q=>'<div class="ava" style="background:'+WHO[q].cor+'">'+WHO[q].ini+'</div>').join('')+'</div>';
  const w = WHO[t.quem[0]];
  return '<div class="ava" style="background:'+w.cor+'">'+w.ini+'</div>';
}

function telaLista(){
  atual = null;
  list.hidden = false; thread.hidden = true; composer.hidden = true;
  head.innerHTML = '<div class="hd"><h1>conversas</h1><div class="sub">the poem situation</div></div>'+
    '<button class="tool" id="exportar">exportar</button>'+
    '<button class="tool" id="zerar" style="margin-left:6px">recomeçar</button>';
  $('exportar').onclick = exportar;
  $('zerar').onclick = zerar;

  list.innerHTML = S.ordem.map(id=>{
    const t = S.threads[id];
    if (!t.aberto) return '';
    const nome = t.tipo==='grupo' ? t.nome : WHO[t.quem[0]].handle;
    const esperando = pendentes(id) || (t.fila||[]).length;
    return '<div class="item" data-id="'+id+'">'+avatarHTML(t)+
      '<div class="txt"><div class="nm">'+esc(nome)+(t.naoLidas?'<span class="dot"></span>':'')+'</div>'+
      '<div class="pv">'+esc(preview(id))+'</div></div>'+
      (esperando&&!t.naoLidas?'<span class="pv" style="flex:none">…</span>':'')+'</div>';
  }).join('');

  const itens = list.querySelectorAll('.item');
  for (let i=0;i<itens.length;i++){
    itens[i].onclick = function(){ abrir(this.getAttribute('data-id')); };
  }
}

function abrir(id){
  atual = id; replyTo = null; rbar.classList.remove('on');
  S.threads[id].naoLidas = 0; salvar();
  list.hidden = true; thread.hidden = false; composer.hidden = false;
  const t = S.threads[id];
  const nome = t.tipo==='grupo' ? t.nome : WHO[t.quem[0]].handle;
  const sub  = t.tipo==='grupo' ? 'você, '+t.quem.map(q=>WHO[q].nome).join(', ') : WHO[t.quem[0]].nome;
  head.innerHTML = '<button class="back" id="voltar">&lsaquo;</button>'+avatarHTML(t)+
    '<div class="hd"><h1>'+esc(nome)+'</h1><div class="sub">'+esc(sub)+'</div></div>';
  $('voltar').onclick = telaLista;
  desenhar();
  if (!(t.fila||[]).length && pendentes(id)) talvezGerar(id);
}

function desenhar(){
  if (!atual){ if(!list.hidden) telaLista(); return; }
  const t = S.threads[atual];
  let html='';
  t.msgs.forEach(function(m,i){
    if (m.k==='sys'){ html+='<div class="sys">'+esc(m.text)+'</div>'; return; }
    if (m.k==='day'){ html+='<div class="day"><span>'+esc(m.text)+'</span></div>'; return; }
    if (m.k==='poem'){ html+='<div class="poem"><span class="lbl">'+esc(m.lbl)+'</span>'+esc(m.texto)+'</div>'; return; }
    const prev=t.msgs[i-1];
    const gap = !prev || prev.k!=='msg' || prev.who!==m.who;
    const meu = m.who==='me';
    const q = m.reply ? '<div class="quoted"><b>'+esc(m.reply.who)+'</b>'+esc(m.reply.text.slice(0,90))+(m.reply.text.length>90?'…':'')+'</div>' : '';
    const nome = (!meu && gap && t.tipo==='grupo') ? '<span class="who '+m.who+'">'+WHO[m.who].handle+'</span>' : '';
    html += '<div class="msg '+(meu?'me':'')+' '+(gap?'gap':'')+'"><div class="bubble" data-i="'+i+'">'+
      nome+q+esc(m.text).replace(/\n/g,'<br>')+'<span class="time">'+m.t+'</span></div></div>';
  });
  thread.innerHTML = html;
  thread.scrollTop = thread.scrollHeight;
  const bolhas = thread.querySelectorAll('.bubble[data-i]');
  for (let i=0;i<bolhas.length;i++){
    const m = t.msgs[+bolhas[i].getAttribute('data-i')];
    if (!m || m.who==='me' || m.k!=='msg') continue;
    bolhas[i].onclick = function(){
      replyTo = { who: WHO[m.who].handle, text: m.text };
      $('rb-who').textContent = replyTo.who;
      $('rb-text').textContent = replyTo.text;
      rbar.classList.add('on'); input.focus();
    };
  }
  atualizarHint();
}

function atualizarHint(){
  if (!atual || busy) return;
  const t = S.threads[atual];
  if ((t.fila||[]).length){
    let prox = Infinity;
    t.fila.forEach(q=>{ if(q.dueAt<prox) prox=q.dueAt; });
    const min = Math.max(1, Math.round((prox-Date.now())/60000));
    hint.textContent = 'alguém responde em ~'+min+' min';
    nudge.classList.add('ready'); return;
  }
  const n = pendentes(atual);
  if (n){ hint.textContent = n+(n>1?' mensagens esperando':' mensagem esperando'); nudge.classList.add('ready'); }
  else { hint.textContent = storageOK ? 'toque numa mensagem deles pra responder ela' : 'não salvou — use "exportar"';
         nudge.classList.remove('ready'); }
}

function enviar(){
  if (!atual) return;
  const txt = input.value.trim();
  if (!txt){ if(!busy) responderAgora(); return; }
  const ts = Date.now();
  S.threads[atual].msgs.push({k:'msg',who:'me',text:txt,t:stamp(ts),ts,reply:replyTo});
  input.value=''; input.style.height='auto';
  replyTo=null; rbar.classList.remove('on');
  checarDestravar();
  salvar(); desenhar();
}

function exportar(){
  let txt='';
  for (const id of S.ordem){
    const t = S.threads[id];
    if (!t.aberto || !t.msgs.length) continue;
    txt += '\n\n===== '+(t.tipo==='grupo'?t.nome:WHO[t.quem[0]].handle)+' =====\n';
    txt += t.msgs.map(m=>{
      if (m.k==='poem') return '\n[poema — '+m.lbl+']\n'+m.texto+'\n';
      if (m.k==='sys'||m.k==='day') return '\n('+m.text+')\n';
      const q = m.reply ? '  respondendo '+m.reply.who+'\n' : '';
      return (m.who==='me'?'bel':WHO[m.who].handle)+' ['+m.t+']\n'+q+m.text;
    }).join('\n');
  }
  const final = txt.trim();
  navigator.clipboard.writeText(final)
    .then(function(){ if(atual) hint.textContent='conversa copiada'; else alert('conversa copiada'); })
    .catch(function(){
      const w=window.open('','_blank');
      if(w) w.document.write('<pre style="white-space:pre-wrap;font:14px system-ui;padding:16px">'+esc(final)+'</pre>');
    });
}

function zerar(){
  if (!confirm('apagar todas as conversas e voltar ao começo?')) return;
  S = estadoInicial(); atual=null;
  try{ localStorage.removeItem(KEY); }catch(e){}
  salvar(); telaLista();
}

$('clip').onclick = function(){
  if (!atual) return;
  const chaves = Object.keys(POEMAS);
  $('poemlist').innerHTML = chaves.map(k=>
    '<button class="p" data-k="'+k+'">'+esc(POEMAS[k].titulo)+'<small>'+esc(POEMAS[k].texto.split('\n')[0])+'…</small></button>').join('');
  const bts = $('poemlist').querySelectorAll('button.p');
  for (let i=0;i<bts.length;i++){
    bts[i].onclick = function(){
      const p = POEMAS[this.getAttribute('data-k')];
      const ts = Date.now();
      S.threads[atual].msgs.push({k:'poem',lbl:p.titulo,texto:p.texto,t:stamp(ts),ts});
      sheet.classList.remove('on');
      checarDestravar(); salvar(); desenhar();
    };
  }
  sheet.classList.add('on');
};
$('sheet-x').onclick = function(){ sheet.classList.remove('on'); };
sheet.onclick = function(e){ if (e.target===sheet) sheet.classList.remove('on'); };

$('send').onclick = enviar;
nudge.onclick = function(){ responderAgora(); };
$('rb-x').onclick = function(){ replyTo=null; rbar.classList.remove('on'); };
input.addEventListener('keydown', function(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); enviar(); } });
input.addEventListener('input', function(){ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,120)+'px'; });
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState!=='visible') return;
  flushTudo();
  if (atual && !(S.threads[atual].fila||[]).length && pendentes(atual)) talvezGerar(atual);
  else talvezPuxar();
});

carregar();
if (!S.ultimaPuxada) { S.ultimaPuxada = Date.now(); salvar(); }
flushTudo();
telaLista();
setTimeout(talvezPuxar, 1500);
</script>
