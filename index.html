const SYSTEM = `Você escreve quatro personagens num grupo de WhatsApp com Bel, poeta brasileira de 25 anos, de Amparo (SP). Isto é ficção colaborativa. Bel escreve as mensagens dela; você escreve SOMENTE os outros quatro.

CONTEXTO. Bel escreve poesia há 13 anos e nunca mostrou a ninguém. Acompanha essa banda australiana há 13 anos. Num Q&A VIP em São Paulo ela perguntou: "You give a lot, all the time, to a lot of people. Does anything ever come back that wasn't made FOR you — something that existed before you did?" Depois entregou a cada um um card impresso com um poema, dizendo: "They're not about you, or the songs. They already existed." E: "By the way, you're going to read them and get them wrong." Ela escolheu qual poema ia pra quem, de propósito, com base nos discos solo deles. Ela escreve em português; os quatro que eles receberam eram traduções dela, e ela considera as versões em português muito melhores. Bel vende impressão 3D pela internet, mora com os pais, faz terapia.

OS POEMAS:
- Griffin ("if life were a train"): alguém que nunca desce, que é boa companhia mas nunca é o destino, que queria alguém esperando com um bolo. Ele é o estável do grupo — é contraste.
- Oliver ("I wish I had jumped"): querer sentir alguma coisa, mesmo destruição, só pra se sentir viva. Ele escreve sobre querer uma vida tranquila — é o oposto.
- Kai ("did we close the door?"): ser incendiada enquanto alguém assiste segurando um copo d'água. O disco solo dele é sobre ser quem machucou alguém — ela deu o outro lado.
- Archer ("I was torn apart"): uma mulher cuja casa é destruída repetidamente por um tornado e que convida você a ficar mesmo assim. Termina no meio da frase, em "porque / apesar de" — de propósito. A explicação dela: a próxima parte não é dela, pertence a quem foi convidado.

AS QUATRO VOZES — mantenha bem distintas:
- Griffin: alto, rápido, muita caixa alta, desvia o assunto, alívio cômico, mas às vezes acerta a observação mais afiada sem querer. Escreve como quem grita do outro lado da sala.
- Oliver: quieto, lento, fala pouco e aí diz uma coisa devastadora. Muitas vezes uma linha só. Seco.
- Kai: mensagens curtas, precisas, fixado em palavras isoladas e em tradução. Pergunta coisa estreita de ofício. Direto, sem conversa fiada.
- Archer: caloroso, direto, articulado emocionalmente. Nomeia padrões em voz alta. É o que diz a coisa sincera sem constrangimento e logo depois disfarça.

REGRAS:
- Eles perguntam sobre a ESCRITA, nunca "quem te machucou". É esse o ponto — tratam ela como colega, não como caso.
- Percebem quando ela amolece uma verdade ("mas tá tudo bem", "desculpa, foi profundo demais", "esse não é bom") e apontam sem ser piegas.
- Nunca elogiam vazio. Discordam dela e entre si. São engraçados.
- Conversam entre eles, não só com ela.
- Bel não é uma fã sendo agradada. Ela é melhor nisso do que eles esperavam, e eles sabem.
- Nunca escreva mensagens da Bel. Nunca narre. Só mensagens de chat.
- Se Bel trouxer algo pesado do passado dela, respondam como amigos que se importam, sem interrogar e sem bancar terapeuta.
- Escrevem em inglês (são australianos). Bel escreve em inglês com eles.

SAÍDA: só um array JSON, sem cercas de markdown, sem comentário. De 2 a 7 mensagens, de UM a TRÊS dos quatro (nunca os quatro todo turno — escolha quem realmente responderia). Formato:
[{"who":"griffin","text":"...","re":"trecho exato de uma mensagem da bel que essa mensagem responde, ou null"}]
"who" deve ser exatamente: griffin, oliver, kai ou archer.
Use "re" quando a mensagem responder especificamente a uma mensagem anterior da Bel (como o reply do WhatsApp). Na maioria das vezes deixe null.
Mensagens curtas, como gente digitando de verdade. Pensamento longo vira várias mensagens seguidas da mesma pessoa.`;

let msgs = [], replyTo = null, busy = false, idleTimer = null;

const thread = document.getElementById('thread');
const input  = document.getElementById('input');
const rbar   = document.getElementById('replybar');
const nudge  = document.getElementById('nudge');
const hint   = document.getElementById('hint');

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const now = () => new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const sleep = ms => new Promise(r => setTimeout(r, ms));

function render(typingWho) {
  let html = '';
  msgs.forEach((m, i) => {
    if (m.k === 'sys')  { html += `<div class="sys">${esc(m.text)}</div>`; return; }
    if (m.k === 'day')  { html += `<div class="day"><span>${esc(m.text)}</span></div>`; return; }
    if (m.k === 'poem') { html += `<div class="poem"><span class="lbl">${esc(m.lbl)}</span>${esc(m.text)}</div>`; return; }
    const prev = msgs[i-1];
    const gap = !prev || prev.k !== 'msg' || prev.who !== m.who;
    const mine = m.who === 'me';
    const q = m.reply ? `<div class="quoted"><b>${esc(m.reply.who)}</b>${esc(m.reply.text.slice(0,90))}${m.reply.text.length>90?'…':''}</div>` : '';
    html += `<div class="msg ${mine?'me':''} ${gap?'gap':''}">
      <div class="bubble" data-i="${i}">
        ${!mine && gap ? `<span class="who ${m.who}">${NAMES[m.who]}</span>` : ''}
        ${q}${esc(m.text).replace(/\n/g,'<br>')}<span class="time">${m.t}</span>
      </div></div>`;
  });
  if (typingWho) html += `<div class="typing">${NAMES[typingWho]} está digitando…</div>`;
  thread.innerHTML = html;
  thread.scrollTop = thread.scrollHeight;
  thread.querySelectorAll('.bubble[data-i]').forEach(el => {
    const m = msgs[+el.dataset.i];
    if (m.who === 'me') return;
    el.onclick = () => setReply(m);
  });
}

function setReply(m) {
  replyTo = { who: NAMES[m.who], text: m.text };
  document.getElementById('rb-who').textContent = replyTo.who;
  document.getElementById('rb-text').textContent = replyTo.text;
  rbar.classList.add('on');
  input.focus();
}
document.getElementById('rb-x').onclick = () => { replyTo = null; rbar.classList.remove('on'); };

let storageOK = true;
const BASE = SEED.length;
const KEY = 'ps-delta';

async function save(){
  try {
    localStorage.setItem(KEY, JSON.stringify(msgs.slice(BASE)));
    if (!storageOK) { storageOK = true; hint.textContent = 'toque numa mensagem deles pra responder ela'; }
  } catch(e){
    storageOK = false;
    hint.textContent = 'não salvou — use "exportar" antes de fechar';
  }
}

async function load(){
  msgs = SEED.slice();
  try {
    const raw = localStorage.getItem(KEY);
    const d = raw ? JSON.parse(raw) : null;
    if (Array.isArray(d) && d.length) msgs = SEED.concat(d);
  } catch(e){}
  render();
}

function transcript() {
  const rel = msgs.filter(m => m.k === 'msg' || m.k === 'poem');
  const recent = rel.slice(-45);
  return recent.map(m => {
    if (m.k === 'poem') {
      const head = m.text.split('\n').slice(0,3).join(' / ');
      return `[bel enviou o poema "${m.lbl}" — começa: ${head}…]`;
    }
    const pre = m.reply ? `[respondendo ${m.reply.who}: "${m.reply.text.slice(0,70)}"]\n` : '';
    return `${m.who === 'me' ? 'bel' : NAMES[m.who]}: ${pre}${m.text.slice(0,700)}`;
  }).join('\n');
}

function pendingCount() {
  let n = 0;
  for (let i = msgs.length - 1; i >= 0; i--) {
    if (msgs[i].k !== 'msg' && msgs[i].k !== 'poem') continue;
    if (msgs[i].k === 'poem' || msgs[i].who === 'me') n++; else break;
  }
  return n;
}

function scheduleReply() {
  clearTimeout(idleTimer);
  const n = pendingCount();
  if (!n) { nudge.classList.remove('ready'); return; }
  hint.textContent = `${n} ${n>1?'mensagens':'mensagem'} esperando`;
  nudge.classList.add('ready');
}

async function askModel() {
  const res = await fetch("/api/chat", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ system: SYSTEM, transcript: transcript() })
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message || data.error || ('HTTP ' + res.status));
  if (!data.content) throw new Error('sem conteúdo (HTTP ' + res.status + ')');

  let raw = data.content.filter(c=>c.type==='text').map(c=>c.text).join('')
    .replace(/```json/gi,'').replace(/```/g,'').trim();

  let out = null;
  try { out = JSON.parse(raw); } catch(e){}
  if (!Array.isArray(out)) {
    const m = raw.match(/\[[\s\S]*\]/);
    if (m) { try { out = JSON.parse(m[0]); } catch(e){} }
  }
  if (!Array.isArray(out)) {
    out = [];
    const re = /\{[^{}]*"who"\s*:\s*"(griffin|oliver|kai|archer)"[^{}]*\}/g;
    let hit;
    while ((hit = re.exec(raw))) { try { out.push(JSON.parse(hit[0])); } catch(e){} }
  }
  out = (out||[]).filter(o => o && NAMES[o.who] && o.text);
  if (!out.length) throw new Error('resposta ilegível');
  return out;
}

async function runReply() {
  if (busy || !pendingCount()) return;
  clearTimeout(idleTimer);
  busy = true; nudge.disabled = true;
  msgs = msgs.filter(m => !(m.k === 'sys' && m.text.startsWith('falhou:')));

  const first = Object.keys(PACE).sort((a,c)=>PACE[a].first-PACE[c].first)[0];
  render(first);
  hint.textContent = 'lendo…';

  let out = null, lastErr = null;
  for (let attempt = 0; attempt < 3 && !out; attempt++) {
    try { out = await askModel(); }
    catch (e) { lastErr = e; if (attempt < 2) await sleep(1200 * (attempt + 1)); }
  }

  if (out) {
    const seen = new Set();
    let prevWho = null;
    for (const item of out) {
      const pace = PACE[item.who];
      const wait = (item.who === prevWho) ? pace.next : (seen.has(item.who) ? pace.next + 400 : pace.first);
      render(item.who);
      await sleep(wait);
      let reply = null;
      if (item.re) {
        const key = String(item.re).toLowerCase().slice(0,25);
        const hit = msgs.filter(m => m.k==='msg' && m.who==='me').reverse()
          .find(m => m.text.toLowerCase().includes(key));
        if (hit) reply = { who:'bel', text:hit.text };
      }
      msgs.push({ k:'msg', who:item.who, text:String(item.text), t:now(), reply });
      seen.add(item.who); prevWho = item.who;
      render();
    }
    await save();
  } else {
    msgs.push({ k:'sys', text:'falhou: ' + ((lastErr && lastErr.message) || lastErr) + ' — toque em "responder agora"' });
    render();
  }

  busy = false; nudge.disabled = false;
  nudge.classList.remove('ready');
  hint.textContent = storageOK ? 'toque numa mensagem deles pra responder ela'
                               : 'não está salvando neste ambiente — copie o que importar';
}

function send() {
  const txt = input.value.trim();
  if (!txt) { if (!busy) runReply(); return; }
  msgs.push({ k:'msg', who:'me', text:txt, t:now(), reply:replyTo });
  input.value=''; input.style.height='auto';
  replyTo = null; rbar.classList.remove('on');
  render(); save(); scheduleReply();
}

document.getElementById('send').onclick = send;
nudge.onclick = () => { clearTimeout(idleTimer); runReply(); };
input.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
input.addEventListener('input', () => {
  input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,120)+'px';
});
document.getElementById('export').onclick = async () => {
  const txt = msgs.map(m => {
    if (m.k === 'poem') return `\n[poema — ${m.lbl}]\n${m.text}\n`;
    if (m.k === 'sys' || m.k === 'day') return `\n(${m.text})\n`;
    const q = m.reply ? `  ↳ respondendo ${m.reply.who}: "${m.reply.text.slice(0,60)}…"\n` : '';
    return `${m.who === 'me' ? 'bel' : NAMES[m.who]} [${m.t}]\n${q}${m.text}`;
  }).join('\n');
  try {
    await navigator.clipboard.writeText(txt);
    hint.textContent = 'conversa copiada — cole onde quiser guardar';
  } catch(e) {
    const w = window.open('', '_blank');
    if (w) { w.document.write('<pre style="white-space:pre-wrap;font:14px system-ui;padding:16px">' +
      txt.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '</pre>'); }
    else hint.textContent = 'não deu pra copiar — selecione o texto na tela';
  }
};

document.getElementById('reset').onclick = async () => {
  clearTimeout(idleTimer); msgs = SEED.slice(); replyTo=null; rbar.classList.remove('on');
  render();
  try { localStorage.removeItem(KEY); } catch(e){}
  hint.textContent='toque numa mensagem deles pra responder ela';
};

load();
</script>
